server:
  port: 8182
spring:
  application:
    name: smallstoredashboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smallstorebackend}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:test}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  flyway:
    enabled: true
    baseline-on-migrate: true  # Ensures Flyway runs on an existing database
    locations: classpath:db/migration
    logging:
      level:
        org:
          flywaydb: DEBUG
  websocket:
    message-size-limit: 128KB
    buffer-size-limit: 512KB
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${contact.mail.from}
    password: ${contact.mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

contact:
  mail:
    from: ${mailfrom}
    password: ${mailpassword}
    to: ${mailto}